<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Applesauce Studios</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: #050510;
    color: #fff;
    font-family: Georgia, 'Times New Roman', serif;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .ui { font-family: 'Arial Black', Impact, sans-serif; }

  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 40;
    transition: all .5s ease;
    padding: 0 1.5rem;
    height: 4rem;
    display: flex; align-items: center; justify-content: space-between;
  }
  .topbar.scrolled {
    background: rgba(0,0,0,.6);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,.1);
  }
  .brand { font-size: 11px; letter-spacing: .4em; text-transform: uppercase; font-weight: 900; }
  .brand span { color: #FF8C00; }
  .topbar a.contact-link {
    display: none; align-items: center; gap: .5rem;
    color: rgba(255,255,255,.7); text-decoration: none;
    font-size: 11px; letter-spacing: .3em; text-transform: uppercase;
    transition: color .3s;
  }
  .topbar a.contact-link:hover { color: #fff; }
  @media (min-width: 640px) { .topbar a.contact-link { display: flex; } }

  .hero {
    position: relative; height: 100vh; min-height: 640px; width: 100%; overflow: hidden;
  }
  .hero-bg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center;
    animation: breathe 28s ease-in-out infinite;
    will-change: transform;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1.15); }
    50% { transform: scale(1.22); }
  }
  .hero-grad-b { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,.7), rgba(0,0,0,.2), rgba(0,0,0,.9)); }
  .hero-grad-r { position: absolute; inset: 0; background: linear-gradient(to right, rgba(5,5,16,.8), transparent); }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand">Applesauce <span>Studios</span></div>
    
    <!-- LINKTREE ADDED HERE -->
    <a href="https://linktr.ee" style="color: #FF8C00; text-decoration: none; font-size: 11px; letter-spacing: .3em; text-transform: uppercase;">Linktree</a>
    
    <a href="#" class="contact-link">Contact</a>
  </div>

</body>
</html>
