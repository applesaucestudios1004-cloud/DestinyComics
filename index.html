<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    /* Full screen background image styling */
    body {
      background-image: url('background.png');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
      background-color: #0b0b0d; /* fallback color */
    }

    /* Translucent layout wrapper to ensure clean text legibility over art */
    .page-overlay {
      min-height: 100vh;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 50px;
    }

    .logo-container img {
      max-width: 180px;
      height: auto;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 3rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin: 10px 0;
      font-weight: 400;
    }

    .subtitle {
      font-size: 1rem;
      letter-spacing: 6px;
      color: #a0a0a5;
      text-transform: uppercase;
      margin-bottom: 30px;
    }

    /* Comic items display configuration grid */
    .comics-grid {
      display: flex;
      gap: 40px;
      justify-content: center;
      flex-wrap: wrap;
      max-width: 1000px;
      width: 100%;
      margin-bottom: 60px;
    }

    .comic-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      width: 320px;
      padding: 20px;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .production-box {
      border: 2px dashed rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #808085;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .comic-title {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 15px;
    }

    .green-text {
      color: #00ff88;
    }

    .magenta-text {
      color: #ff00ff;
    }

    /* Footer styling with active mailto link mapping */
    footer {
      margin-top: auto;
      text-align: center;
      font-size: 0.9rem;
      letter-spacing: 1px;
      color: #808085;
    }

    footer a {
      color: #00ff88;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    footer a:hover {
      text-decoration: underline;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="page-overlay">
    
    <header>
      <div class="logo-container">
        <!-- Renders the logo uploaded to your root folder -->
        <img src="logo.png" alt="Applesauce Studios Logo">
      </div>
      <h1>Applesauce Studios</h1>
      <div class="subtitle">Comic Book Studio</div>
    </header>

    <main class="comics-grid">
      <!-- Left Slot: Destiny Graphic Novel Placeholder -->
      <div class="comic-card">
        <div class="production-box">
          Live Background Active
        </div>
        <div class="comic-title green-text">Destiny Graphic Novel</div>
      </div>

      <!-- Right Slot: Upcoming Comic Production Slot -->
      <div class="comic-card">
        <div class="production-box">
          In Production
        </div>
        <div class="comic-title magenta-text">Destiny Comics #1 (Coming Soon)</div>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 Applesauce Studios. All rights reserved.</p>
      <p>Inquiries: <a href="mailto:applesaucestudios1004@gmail.com">applesaucestudios1004@gmail.com</a></p>
    </footer>

  </div>

</body>
</html>
